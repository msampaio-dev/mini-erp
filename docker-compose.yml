services:
  postgres:
    image: postgres:18-alpine
    container_name: mini-erp-db
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: mini_erp
    ports:
      # 5433 no host para não conflitar com um Postgres local na 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d mini_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
